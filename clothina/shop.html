<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shop · CLOTHINA</title>
<meta name="description" content="Shop CLOTHINA streetwear: relaxed layers, oversized fits, new drops, and everyday essentials.">
<link rel="icon" href="assets/img/brand/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="assets/img/brand/favicon.png">
<link rel="preload" as="image" href="assets/img/brand/clothina-wordmark-white.png">
<link rel="preconnect" href="https://ymsrfxmwwpwjgzzaytsh.supabase.co" crossorigin>
<link rel="stylesheet" href="assets/css/main.css">
</head>
<body data-page="shop">

<div id="site-header"></div>

<main>
  <section class="page-head">
    <div class="container">
      <nav class="crumbs" aria-label="Breadcrumb">
        <a href="index.html">Home</a><span class="sep">/</span><span>Shop</span>
      </nav>
      <div class="section-head" style="margin-bottom:0">
        <div class="stack">
          <span class="eyebrow">THE SHOP</span>
          <h1 class="title-lg">Shop all</h1>
        </div>
        <p class="muted tiny" id="resCount">—</p>
      </div>
    </div>
  </section>

  <section class="section" style="padding-top:0">
    <div class="container">
      <div class="filters">
        <div id="catChips" role="group" aria-label="Filter products by style" style="display:flex;gap:9px;flex-wrap:wrap"></div>
        <span class="spacer"></span>
        <select class="select" id="sortSel" aria-label="Sort products">
          <option value="featured">Sort: Featured</option>
          <option value="new">Newest</option>
          <option value="price-asc">Price: Low to high</option>
          <option value="price-desc">Price: High to low</option>
        </select>
      </div>

      <div class="grid-products" id="shopGrid">
        <div class="skeleton" style="aspect-ratio:4/5"></div>
        <div class="skeleton" style="aspect-ratio:4/5"></div>
        <div class="skeleton" style="aspect-ratio:4/5"></div>
        <div class="skeleton" style="aspect-ratio:4/5"></div>
      </div>
    </div>
  </section>
</main>

<div id="site-footer"></div>

<script defer src="assets/js/config.js"></script>
<script defer src="assets/js/env.js"></script>
<script defer src="assets/js/core.js"></script>
<script defer src="assets/js/shop.page.js"></script>
</body>
</html>
